version: 2.1

parameters:
  run-production-qa:
    type: boolean
    default: false

executors:
  node:
    docker:
      - image: cimg/node:22.22
    resource_class: medium
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      REPLAYQA_CLI_VERSION: "0.2.4"

commands:
  install:
    steps:
      - restore_cache:
          keys:
            - npm-v1-{{ arch }}-{{ checksum "package-lock.json" }}
      - run: npm ci
      - save_cache:
          key: npm-v1-{{ arch }}-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

jobs:
  check:
    executor: node
    steps:
      - checkout
      - install
      - run: node --test scripts/circleci-pr.test.mjs
      - run: npm run check

  replayqa-pr:
    executor: node
    environment:
      REPLAYQA_PROXY_TIMEOUT_MS: "300000"
      REPLAYQA_PROXY_PORT: "18888"
      REPLAYQA_RUN_TIMEOUT_MS: "3600000"
      REPLAYQA_PROXY_LOG: /tmp/replayqa-logs/replayqa-proxy.jsonl
    steps:
      - checkout
      - run:
          name: Skip non-PR, draft, fork, or superseded revisions
          command: |
            node scripts/check-circleci-pr.mjs
            if [ ! -f /tmp/replayqa-pr-ready ]; then
              circleci-agent step halt
            fi
      - install
      - run:
          name: Validate Replay QA credentials
          command: |
            : "${REPLAY_QA_PROJECT_ID:?Set REPLAY_QA_PROJECT_ID in CircleCI project environment variables}"
            : "${REPLAY_QA_API_KEY:?Set REPLAY_QA_API_KEY in CircleCI project environment variables}"
            npx --yes replayqa@${REPLAYQA_CLI_VERSION} project --ignore-config --project "$REPLAY_QA_PROJECT_ID" >/dev/null
      - run: node --test scripts/circleci-pr.test.mjs
      - run: npm run check
      - run:
          name: Start the demo app
          background: true
          command: |
            mkdir -p /tmp/replayqa-logs
            npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/replayqa-logs/reminders-next.log 2>&1
      - run:
          name: Wait for the demo app
          command: |
            for attempt in {1..60}; do
              if curl --fail --silent http://127.0.0.1:3000 >/dev/null; then exit 0; fi
              sleep 1
            done
            cat /tmp/replayqa-logs/reminders-next.log
            exit 1
      - run:
          name: Run Replay QA through the reverse proxy
          no_output_timeout: 75m
          command: |
            set -o pipefail
            timeout --signal=TERM --kill-after=30s 70m npm run qa:ci 2>&1 | tee /tmp/replayqa-logs/replayqa-ci.log
      - store_artifacts:
          path: /tmp/replayqa-logs
          destination: replayqa-pr

  replayqa-production:
    executor: node
    steps:
      - checkout
      - install
      - run:
          name: Validate production configuration and wait for deployment
          command: |
            : "${REPLAY_QA_API_KEY:?Set REPLAY_QA_API_KEY}"
            : "${REPLAY_QA_PRODUCTION_PROJECT_ID:?Set REPLAY_QA_PRODUCTION_PROJECT_ID}"
            : "${REPLAY_QA_PRODUCTION_URL:?Set REPLAY_QA_PRODUCTION_URL}"
            mkdir -p /tmp/replayqa-logs
            for attempt in {1..60}; do
              status=$(curl --silent --location --output /dev/null --write-out '%{http_code}' --max-time 10 "$REPLAY_QA_PRODUCTION_URL" || true)
              case "$status" in
                2??|3??) exit 0 ;;
                401|403) echo "Deployment protection blocks Replay QA (HTTP $status)."; exit 1 ;;
              esac
              sleep 2
            done
            echo "Production deployment did not become reachable."
            exit 1
      - run:
          name: Request production QA
          command: |
            set -o pipefail
            npm run qa:production 2>&1 | tee /tmp/replayqa-logs/replayqa-production.log
      - store_artifacts:
          path: /tmp/replayqa-logs
          destination: replayqa-production

workflows:
  ci:
    unless: << pipeline.parameters.run-production-qa >>
    jobs:
      - check:
          filters:
            branches:
              only: main
      - replayqa-pr:
          filters:
            branches:
              ignore: main
  production-qa:
    when: << pipeline.parameters.run-production-qa >>
    jobs:
      - replayqa-production:
          filters:
            branches:
              only: main
